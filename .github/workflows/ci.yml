name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The suite only reads. A token that can write is a token a dependency's install
# script could abuse.
permissions:
  contents: read

concurrency:
  # Superseded pull-request runs are wasted work; superseded runs on main are
  # history, and a cancelled run there reads as a failure to anyone watching.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # The tests assert on Chinese text and unittest prints it in failure messages.
  # A Windows runner without this hits cp1252 and raises UnicodeEncodeError from
  # inside the reporting code, which buries the assertion that actually failed.
  PYTHONUTF8: "1"

jobs:
  test:
    name: ${{ matrix.os }} - Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      # Every cell is a real answer. Cancelling the others on the first failure
      # would hide, for instance, that something breaks only on 3.9.
      fail-fast: false
      matrix:
        include:
          # 3.9 is the floor the README promises, and the project claims to use
          # nothing newer. Testing the claim is the point of listing it.
          - os: ubuntu-24.04
            python: "3.9"
          - os: ubuntu-24.04
            python: "3.11"
          - os: ubuntu-24.04
            python: "3.12"
          # The project is developed on Windows, and storage here is file-based.
          - os: windows-2025
            python: "3.11"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      # Pinned runners still drift, so record what actually ran.
      - name: Interpreter
        run: python -V

      # No `pip install`: requirements.txt is comments only, and the package
      # imports nothing outside the standard library. Installing it would be a
      # step that proves nothing and can only fail.
      - name: Unit tests
        run: python -m unittest discover -s tests -v

      # `--audit` builds no agent and writes no files; it re-reads every prompt
      # and template and fails on a content rule violation. It is the cheapest
      # check that the package actually loads end to end.
      - name: Smoke test - content audit
        run: python main.py --audit

  # One required status check, so branch protection does not have to be updated
  # every time the matrix gains a dimension.
  ci_ok:
    name: ci-ok
    needs: [test]
    # Without `always()` a failed dependency makes this job `skipped`, and a
    # skipped required check does not report success - the pull request just
    # hangs with no red X explaining why.
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Verify every job succeeded
        run: |
          echo "test: ${{ needs.test.result }}"
          test "${{ needs.test.result }}" = "success"
